<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стремянка — концепции сайта</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/base.css">
<style>
  main.wrap { padding-top: 112px; padding-bottom: 80px; }
  h1 { margin: 0 0 40px; font-size: 32px; line-height: 1.08; letter-spacing: -.02em; font-weight: 500; }
  .list { display: grid; gap: 12px; }
  .card {
    display: grid; gap: 24px; align-content: space-between; padding: 24px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--card);
    transition: background-color .16s var(--ease), border-color .16s var(--ease);
  }
  .card:hover { background: var(--raised); border-color: var(--line-strong); }
  .card .n { font-size: 56px; line-height: 1; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .card .btn { justify-self: start; }
  @media (min-width: 900px) {
    h1 { font-size: 56px; margin-bottom: 48px; }
    .list { grid-template-columns: repeat(3, 1fr); }
    .card { min-height: 280px; padding: 32px; }
    .card .n { font-size: 88px; }
  }
</style>
</head>
<body>
<header class="top">
  <span class="brand"><img src="assets/logo.svg" alt="">Streamyanka</span>
</header>

<main class="wrap">
  <h1>Концепции для сайта агентства «Стремянка»</h1>

  <div class="list">
    <a class="card" href="c1/"><span class="n">№ 1</span><span class="btn btn-main">Смотреть</span></a>
    <a class="card" href="c2/"><span class="n">№ 2</span><span class="btn btn-main">Смотреть</span></a>
    <a class="card" href="c3/"><span class="n">№ 3</span><span class="btn btn-main">Смотреть</span></a>
  </div>
</main>
</body>
</html>
